name: WELP Security Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: welp-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security and Build Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Security Smoke Test
        run: npm run security:smoke

      - name: Check Functions Syntax
        run: node --check functions/index.js

      - name: Build Application
        run: npm run build
